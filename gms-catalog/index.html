<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue GMS — Teatower</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{
    --bg:#faf7f2; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3ddd2;
    --tt:#2d5a3d; --accent:#b08e4d; --hl:#fff7db;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
  header{position:sticky;top:0;z-index:5;background:var(--tt);color:#fff;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  .toolbar{position:sticky;top:54px;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:180px;padding:9px 12px;font-size:15px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .toolbar select{padding:8px 10px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  .meta{padding:6px 14px;color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
  thead th{position:sticky;top:104px;background:#f3eee4;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;color:#444;font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
  thead th:hover{background:#ebe4d4}
  thead th .arrow{color:var(--accent);font-size:10px;margin-left:3px}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:nth-child(even){background:#fcfaf6}
  tbody td{padding:10px;vertical-align:middle}
  td.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:var(--tt);white-space:nowrap}
  td.ean{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#444;white-space:nowrap}
  td.name{font-weight:500}
  td.barcode{text-align:center;width:180px}
  td.barcode svg{display:block;cursor:zoom-in;background:#fff;border-radius:4px;padding:2px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:#555;white-space:nowrap}
  button.copy{font-size:11px;padding:3px 7px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:#666;margin-left:6px}
  button.copy:hover{background:var(--hl);border-color:var(--accent);color:#444}
  button.copy.ok{background:#dbeed1;color:#225c2a;border-color:#225c2a}
  mark{background:var(--hl);padding:0 2px}
  footer{padding:18px 14px;color:var(--muted);font-size:11px;text-align:center;border-top:1px solid var(--line);margin-top:20px}
  /* Modal pour barcode plein écran (scan facile) */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  #modal.on{display:flex}
  #modal .box{background:#fff;border-radius:14px;padding:26px 30px;text-align:center;max-width:92vw}
  #modal .box .lbl{font-size:13px;color:#666;margin-bottom:6px}
  #modal .box .nm{font-weight:600;margin-bottom:14px;font-size:15px}
  #modal .box svg{width:min(80vw,520px);height:auto}
  @media(max-width:640px){
    thead th{top:104px;font-size:10px;padding:6px 6px}
    tbody td{padding:8px 6px;font-size:13px}
    td.barcode{width:auto}
    td.barcode svg{width:140px;height:auto}
    th.num,td.num{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>Catalogue GMS — Teatower</h1>
  <div class="sub">Code interne · EAN13 scannable · libellé · prix HT</div>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="Rechercher (code, EAN, nom)…" autofocus>
  <select id="cat"><option value="">Toutes catégories</option></select>
</div>
<div class="meta" id="meta">…</div>
<table>
  <thead>
    <tr>
      <th data-sort="code">Code <span class="arrow"></span></th>
      <th data-sort="name">Libellé <span class="arrow"></span></th>
      <th data-sort="ean">EAN13 <span class="arrow"></span></th>
      <th>Code-barres</th>
      <th data-sort="categ">Catégorie <span class="arrow"></span></th>
      <th class="num" data-sort="price">PV HT <span class="arrow"></span></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div id="modal"><div class="box"><div class="lbl" id="m-code"></div><div class="nm" id="m-name"></div><svg id="m-svg"></svg></div></div>

<footer>
  Source : Odoo · Catalogue produits Teatower vendus en GMS.<br>
  Mis à jour le <span id="updated">—</span>. Tapotez un code-barres pour l'agrandir et le scanner.
</footer>

<script>
let DATA=[], filtered=[], sortKey="code", sortDir=1;
const $=s=>document.querySelector(s);
const escapeHtml=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  const q=($("#q").value||"").toLowerCase().trim();
  const cat=$("#cat").value;
  filtered=DATA.filter(r=>{
    if(cat && r.categ!==cat) return false;
    if(!q) return true;
    return (r.code+" "+r.ean+" "+r.name).toLowerCase().includes(q);
  });
  filtered.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==="string"){return sortDir*((x||"").localeCompare(y||""))}
    return sortDir*((x||0)-(y||0));
  });
  const hl=s=>{
    s=escapeHtml(s||"");
    if(!q) return s;
    return s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
  };
  $("#tbody").innerHTML=filtered.map((r,i)=>`
    <tr data-idx="${i}">
      <td class="code">${hl(r.code||"—")}</td>
      <td class="name">${hl(r.name)}</td>
      <td class="ean">${hl(r.ean||"—")}${r.ean?`<button class="copy" data-c="${r.ean}">copier</button>`:""}</td>
      <td class="barcode">${r.ean?`<svg class="bc" data-ean="${r.ean}" data-name="${escapeHtml(r.name)}" data-code="${r.code}"></svg>`:""}</td>
      <td>${escapeHtml(r.categ||"")}</td>
      <td class="num">${r.price?r.price.toFixed(2)+" €":""}</td>
    </tr>`).join("");
  $("#meta").textContent=`${filtered.length} produit${filtered.length>1?"s":""} affiché${filtered.length>1?"s":""} · ${DATA.length} au total`;
  document.querySelectorAll("thead th").forEach(th=>{
    const arrow=th.querySelector(".arrow");
    if(!arrow) return;
    arrow.textContent = (th.dataset.sort===sortKey)?(sortDir===1?"▲":"▼"):"";
  });
  // Render barcodes
  document.querySelectorAll("svg.bc").forEach(el=>{
    try{
      JsBarcode(el, el.dataset.ean, {
        format:"EAN13", width:1.6, height:38, fontSize:11,
        margin:2, background:"#ffffff", lineColor:"#1a1a1a", displayValue:true
      });
    }catch(e){ el.outerHTML='<span style="color:#c44;font-size:11px">EAN invalide</span>' }
  });
}

function openModal(ean,name,code){
  $("#m-code").textContent=code||"";
  $("#m-name").textContent=name||"";
  try{
    JsBarcode("#m-svg", ean, {format:"EAN13",width:3,height:120,fontSize:22,margin:8,background:"#fff",lineColor:"#000"});
  }catch(e){}
  $("#modal").classList.add("on");
}

document.addEventListener("click",e=>{
  const cb=e.target.closest("button.copy");
  if(cb){
    e.stopPropagation();
    navigator.clipboard.writeText(cb.dataset.c);
    cb.textContent="copié ✓"; cb.classList.add("ok");
    setTimeout(()=>{cb.textContent="copier";cb.classList.remove("ok")},1200);
    return;
  }
  const bc=e.target.closest("svg.bc");
  if(bc){ openModal(bc.dataset.ean, bc.dataset.name, bc.dataset.code); return; }
  if(e.target.closest("#modal")){ $("#modal").classList.remove("on"); }
  const th=e.target.closest("thead th[data-sort]");
  if(th){
    const k=th.dataset.sort;
    if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=k==="price"?-1:1;}
    render();
  }
});
$("#q").addEventListener("input",render);
$("#cat").addEventListener("change",render);

fetch("catalog.json?_="+Date.now())
  .then(r=>r.json())
  .then(j=>{
    DATA=j.products; $("#updated").textContent=j.generated_at;
    const cats=[...new Set(DATA.map(r=>r.categ).filter(Boolean))].sort();
    $("#cat").innerHTML='<option value="">Toutes catégories</option>'+cats.map(c=>`<option>${escapeHtml(c)}</option>`).join("");
    render();
  })
  .catch(e=>{$("#meta").textContent="Erreur de chargement: "+e})
;
</script>
</body>
</html>

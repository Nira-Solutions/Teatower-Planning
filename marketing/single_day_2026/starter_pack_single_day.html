<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Starter pack Single Day</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#ececec}
  .scene{width:1080px;height:1350px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#f6f6f6 0%,#e4e4e4 60%,#cfcfcf 100%);
    font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif}

  /* carton noir */
  .card{position:absolute;left:110px;top:95px;width:860px;height:1170px;border-radius:44px;
    background:linear-gradient(160deg,#2a2a2a 0%,#151515 50%,#0b0b0b 100%);
    box-shadow:0 30px 50px rgba(0,0,0,.35),0 6px 12px rgba(0,0,0,.25),
      inset 0 3px 0 rgba(255,255,255,.18),inset 0 -6px 12px rgba(0,0,0,.4)}
  .tab{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:170px;height:70px;
    border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#333,#1a1a1a);
    box-shadow:0 -2px 0 rgba(255,255,255,.15) inset,0 6px 10px rgba(0,0,0,.2)}
  .tab::after{content:"";position:absolute;left:50%;top:18px;transform:translateX(-50%);
    width:80px;height:16px;border-radius:10px;background:#dcdcdc;
    box-shadow:inset 0 3px 5px rgba(0,0,0,.35)}

  .title{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:132px;line-height:1;
    color:#fff;letter-spacing:2px;text-shadow:0 4px 0 #000,0 8px 14px rgba(0,0,0,.5)}

  /* blisters */
  .bub{position:absolute;overflow:hidden;border:3px solid rgba(255,255,255,.45)}
  .gloss{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:
      linear-gradient(115deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 18%),
      linear-gradient(115deg,rgba(255,255,255,0) 62%,rgba(255,255,255,.22) 66%,rgba(255,255,255,0) 72%),
      linear-gradient(0deg,rgba(255,255,255,.14),rgba(255,255,255,0) 20%)}

  /* grand compartiment : logo blanc sur plastique fumé */
  .main{left:40px;top:200px;width:460px;height:820px;border-radius:34px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    box-shadow:0 14px 22px rgba(0,0,0,.5),inset 0 0 0 8px rgba(255,255,255,.05),
      inset -14px -18px 34px rgba(0,0,0,.35),inset 10px 10px 24px rgba(255,255,255,.08)}
  .main .logo{position:absolute;left:40px;top:225px;width:380px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}

  /* petits compartiments : fond clair, produits en couleur */
  .side{left:525px;width:295px;height:152px;border-radius:26px;
    background:linear-gradient(180deg,#f4f4f4,#dadada);
    box-shadow:0 10px 18px rgba(0,0,0,.5),inset -10px -12px 24px rgba(0,0,0,.14),inset 8px 8px 18px rgba(255,255,255,.6)}
  .side img,.side .crop{position:absolute;mix-blend-mode:multiply;filter:saturate(1.1)}
  .crop{overflow:hidden;left:0;top:0;width:295px;height:152px}
  .crop img{filter:none;mix-blend-mode:normal}


  /* coque plastique thermoformée autour de chaque produit (blister jouet) */
  .dome{position:absolute;left:50%;top:50%;width:214px;height:138px;transform:translate(-50%,-50%);
    border-radius:72px/62px;border:2px solid rgba(255,255,255,.95);
    background:
      radial-gradient(ellipse 55% 38% at 30% 20%,rgba(255,255,255,.80),rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 70% 40% at 50% 115%,rgba(0,0,0,.10),rgba(0,0,0,0) 70%),
      linear-gradient(180deg,rgba(255,255,255,.10),rgba(190,215,235,.14));
    box-shadow:0 7px 10px rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.45),0 0 0 7px rgba(0,0,0,.08),
      inset 0 0 0 4px rgba(255,255,255,.45),inset -10px -12px 18px rgba(0,0,0,.14)}
  .dome::after{content:"";position:absolute;right:26px;top:14px;width:13px;height:46px;border-radius:8px;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.2));transform:rotate(20deg)}
  .dome::before{content:"";position:absolute;left:22px;bottom:14px;width:40px;height:8px;border-radius:6px;
    background:rgba(255,255,255,.55);transform:rotate(-8deg)}
  /* rebord thermoscellé sur le grand compartiment */
  .main{outline:6px solid rgba(255,255,255,.10);outline-offset:4px}

  .label{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);
    padding:8px 38px 2px;border-radius:16px;font-size:64px;color:#111;letter-spacing:2px;white-space:nowrap;
    background:linear-gradient(180deg,#fff,#dcdcdc);
    box-shadow:0 4px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.8)}
</style>
</head>
<body>
<div class="scene">
  <div class="card">
    <div class="tab"></div>
    <div class="title">STARTER PACK</div>

    <!-- personnage : fille en T-shirt Teatower avec son chat -->
    <div class="bub main">
      <svg class="perso" viewBox="0 0 460 820" width="454" height="814" style="position:absolute;left:0;top:0">
        <defs>
          <radialGradient id="skin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe0c4"/><stop offset="1" stop-color="#e9b48c"/></radialGradient>
          <radialGradient id="hair" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#8a5a3b"/><stop offset="1" stop-color="#4a2c1a"/></radialGradient>
          <linearGradient id="tee" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef8a4a"/><stop offset="1" stop-color="#c8602a"/></linearGradient>
          <linearGradient id="jean" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f6596"/><stop offset="1" stop-color="#2a4670"/></linearGradient>
          <radialGradient id="cat" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#a9adb6"/><stop offset="1" stop-color="#6c717c"/></radialGradient>
        </defs>
        <g transform="translate(-30 -190) scale(1.2)">
          <!-- ombre -->
          <ellipse cx="214" cy="792" rx="110" ry="14" fill="#000" opacity=".45"/>
          <!-- jambes + baskets -->
          <rect x="160" y="600" width="46" height="165" rx="20" fill="url(#jean)"/>
          <rect x="222" y="600" width="46" height="165" rx="20" fill="url(#jean)"/>
          <ellipse cx="178" cy="770" rx="38" ry="18" fill="#f4f4f4"/>
          <ellipse cx="252" cy="770" rx="38" ry="18" fill="#f4f4f4"/>
          <rect x="142" y="774" width="72" height="8" rx="4" fill="#c25a22"/>
          <rect x="216" y="774" width="72" height="8" rx="4" fill="#c25a22"/>

          <!-- cou -->
          <rect x="198" y="405" width="32" height="40" rx="10" fill="#e3a77c"/>
          <!-- T-shirt + manches courtes -->
          <path d="M152 446 L112 500 L142 520 L166 486 Z" fill="url(#tee)"/>
          <path d="M276 446 L316 500 L286 520 L262 486 Z" fill="url(#tee)"/>
          <path d="M150 445 Q214 428 278 445 L292 615 Q214 632 136 615 Z" fill="url(#tee)"/>
          <path d="M190 436 Q214 452 238 436" stroke="#a84a18" stroke-width="7" fill="none" stroke-linecap="round"/>
          <!-- logo Teatower sur le T-shirt -->
          <image href="img/logo_blanc.svg" x="146" y="456" width="66" height="50"/>

          <!-- queue du chat qui pend -->
          <path d="M150 585 Q120 620 140 660 Q150 676 160 664 Q142 628 168 596 Z" fill="url(#cat)"/>
          <!-- corps du chat -->
          <ellipse cx="210" cy="570" rx="78" ry="40" fill="url(#cat)"/>
          <path d="M165 552 q8 14 0 30 M190 545 q8 16 0 36 M215 545 q8 16 0 36" stroke="#5a5f69" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- tête du chat -->
          <g transform="translate(-30 -6)">
          <path d="M248 508 L256 470 L276 496 Z" fill="#7d828c"/>
          <path d="M300 496 L320 470 L326 508 Z" fill="#7d828c"/>
          <path d="M254 492 L258 478 L268 492 Z M308 492 L318 478 L320 492 Z" fill="#f2a5b0"/>
          <ellipse cx="288" cy="528" rx="44" ry="38" fill="url(#cat)"/>
          <ellipse cx="272" cy="524" rx="8" ry="10" fill="#9fd36a"/><ellipse cx="304" cy="524" rx="8" ry="10" fill="#9fd36a"/>
          <ellipse cx="272" cy="525" rx="3" ry="8" fill="#1a1a1a"/><ellipse cx="304" cy="525" rx="3" ry="8" fill="#1a1a1a"/>
          <path d="M283 540 L293 540 L288 546 Z" fill="#f28a9a"/>
          <path d="M288 546 Q282 552 276 548 M288 546 Q294 552 300 548" stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M262 542 L236 538 M262 547 L238 550 M314 542 L340 538 M314 547 L338 550" stroke="#eee" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- bras qui tiennent le chat -->
          <path d="M128 510 Q140 590 200 598" stroke="url(#skin)" stroke-width="30" fill="none" stroke-linecap="round"/>
          <path d="M302 505 Q322 562 292 594" stroke="url(#skin)" stroke-width="30" fill="none" stroke-linecap="round"/>
          <circle cx="206" cy="596" r="17" fill="url(#skin)"/>
          <circle cx="286" cy="594" r="17" fill="url(#skin)"/>

          <!-- cheveux arrière + chignon -->
          <circle cx="214" cy="236" r="40" fill="url(#hair)"/>
          <path d="M120 330 Q118 240 214 236 Q310 240 308 330 L312 410 Q290 420 280 380 L148 380 Q138 420 116 410 Z" fill="url(#hair)"/>
          <!-- tête -->
          <ellipse cx="214" cy="330" rx="84" ry="88" fill="url(#skin)"/>
          <path d="M130 312 Q140 240 214 240 Q292 240 300 314 Q262 272 214 290 Q170 270 130 312 Z" fill="url(#hair)"/>
          <ellipse cx="166" cy="372" rx="15" ry="9" fill="#ff8f8f" opacity=".45"/>
          <ellipse cx="262" cy="372" rx="15" ry="9" fill="#ff8f8f" opacity=".45"/>
          <!-- yeux -->
          <circle cx="182" cy="340" r="8" fill="#2a1a12"/><circle cx="185" cy="337" r="2.6" fill="#fff"/>
          <circle cx="246" cy="340" r="8" fill="#2a1a12"/><circle cx="249" cy="337" r="2.6" fill="#fff"/>
          <path d="M166 310 Q180 302 196 308" stroke="#4a2c1a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M232 308 Q248 302 262 310" stroke="#4a2c1a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- lunettes -->
          <circle cx="182" cy="340" r="27" fill="rgba(255,255,255,.18)" stroke="#151515" stroke-width="7"/>
          <circle cx="246" cy="340" r="27" fill="rgba(255,255,255,.18)" stroke="#151515" stroke-width="7"/>
          <path d="M209 338 Q214 332 219 338" stroke="#151515" stroke-width="6" fill="none"/>
          <path d="M155 336 L132 328" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
          <path d="M273 336 L296 328" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
          <!-- nez + sourire -->
          <path d="M214 352 Q210 366 218 368" stroke="#c98a62" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M190 386 Q214 408 240 386" stroke="#8a3a2a" stroke-width="6" fill="#fff" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="gloss"></div>
    </div>

    <!-- A0304 verre double paroi -->
    <div class="bub side" style="top:200px">
      <img src="img/A0304.jpg" style="width:198px;left:44px;top:-25px">
      <div class="dome"></div>
      <div class="gloss"></div>
    </div>

    <!-- A0271 boule à thé (recadrée sur la boule) -->
    <div class="bub side" style="top:367px">
      <div class="crop" style="-webkit-mask:radial-gradient(circle 66px at 149px 77px,#000 97%,transparent 100%),linear-gradient(#000,#000) 0 92px/112px 60px no-repeat;mask:radial-gradient(circle 66px at 149px 77px,#000 97%,transparent 100%),linear-gradient(#000,#000) 0 92px/112px 60px no-repeat">
        <img src="img/A0271.jpg" style="width:422px;left:-84px;top:-233px">
      </div>
      <div class="dome"></div>
      <div class="gloss"></div>
    </div>

    <!-- V0617 Liberté -->
    <div class="bub side" style="top:534px">
      <img src="img/V0617.jpg" style="width:193px;left:51px;top:-18px">
      <div class="dome"></div>
      <div class="gloss"></div>
    </div>

    <!-- V0839 Caramel beurre salé -->
    <div class="bub side" style="top:701px">
      <img src="img/V0839.jpg" style="width:193px;left:51px;top:-18px">
      <div class="dome"></div>
      <div class="gloss"></div>
    </div>

    <!-- V0841 Lacquemant liégeois -->
    <div class="bub side" style="top:868px">
      <img src="img/V0841.jpg" style="width:193px;left:51px;top:-18px">
      <div class="dome"></div>
      <div class="gloss"></div>
    </div>

    <div class="label">SINGLE DAY · 11.11</div>
  </div>
</div>
</body>
</html>
